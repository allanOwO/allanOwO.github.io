<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Play | Allan Blyth</title>
<style>
html,body{margin:0;height:100%;background:#15111f;overflow:hidden;font-family:system-ui,sans-serif;color:#f4efe6}
body{display:grid;place-items:center;background:#000}
/* Always 16:9: letterbox when the frame or fullscreen display is another shape */
canvas{display:block;width:min(100vw,177.778vh);height:min(100vh,56.25vw);background:#15111f;outline:0}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#bar{width:min(60%,320px);height:10px;border:2px solid #f4efe6;border-radius:2px}
#fill{display:block;height:100%;width:0;background:#ff4d5e}
#msg{font-size:14px;max-width:80%;text-align:center}
</style></head><body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><div id="bar"><i id="fill"></i></div><div id="msg">Loading...</div></div>
<script>
// One shared player for every Unity WebGL build: player.html?g=<folder>
var GAMES={fishing:"Just a Chill Fishing Game",tower:"Tower of Tales",dunrod:"The Ballad of Auld Dunrod"};
var g=new URLSearchParams(location.search).get("g"),msg=document.getElementById("msg"),load=document.getElementById("load");
function fail(t){msg.textContent=t;document.getElementById("bar").style.display="none"}
if(!GAMES.hasOwnProperty(g))fail("Unknown game.");
else{
  document.title=GAMES[g]+" | Allan Blyth";
  var b=g+"/Build/"+g,s=document.createElement("script");
  s.src=b+".loader.js";
  s.onerror=function(){fail("Could not load the game files.")};
  s.onload=function(){
    createUnityInstance(document.getElementById("c"),{
      dataUrl:b+".data.unityweb",frameworkUrl:b+".framework.js.unityweb",codeUrl:b+".wasm.unityweb",
      streamingAssetsUrl:g+"/StreamingAssets",companyName:"Allan Blyth",productName:GAMES[g],productVersion:"1.0",
      showBanner:function(m,t){if(t=="error")fail(m)}
    },function(p){document.getElementById("fill").style.width=100*p+"%"})
    .then(function(){load.style.display="none";document.getElementById("c").focus()})
    .catch(function(e){fail("The game failed to start: "+e)});
  };
  document.body.appendChild(s);
}
</script></body></html>
